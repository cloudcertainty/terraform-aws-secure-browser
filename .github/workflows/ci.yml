name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.7.5", "latest"]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}

      - name: fmt
        run: terraform fmt -recursive -check -diff

      - name: validate module
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate examples
        run: |
          for d in examples/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - name: test (mock provider, no AWS credentials)
        run: terraform test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: README inputs and outputs are up to date (terraform-docs)
        run: |
          docker run --rm -v "$PWD:/terraform-docs" -w /terraform-docs \
            quay.io/terraform-docs/terraform-docs:0.20.0 --output-check . || {
            echo "::error::README.md is out of date. Run 'terraform-docs .' and commit the result."
            exit 1
          }

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive --format compact
