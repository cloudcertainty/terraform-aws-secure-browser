# terraform-docs configuration: `terraform-docs .` rewrites the section between the
# BEGIN_TF_DOCS / END_TF_DOCS markers in README.md. CI checks it is up to date.
formatter: markdown table
version: ">= 0.20.0, < 1.0.0"

sections:
  show:
    - requirements
    - inputs
    - outputs

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: false
  html: true
  indent: 3
  required: true
  sensitive: true
  type: true
